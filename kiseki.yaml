# kiseki.yaml — example deployment config (design.md §15).
#
# Every value here is a starting point, not a recommendation: buckets must be
# filled from the real limits of YOUR apikeys (design.md Lampiran B).
#
# Secrets come from the environment via ${VAR}. A missing variable is a startup
# error (design.md §15.1 rule 4) — the process refuses to run with an empty key
# rather than silently sending anonymous requests.
#
#   ${VAR}              required; startup error if unset or empty
#   ${VAR:-fallback}    use `fallback` when unset or empty
#   ${VAR?why it matters}  required, with a custom error message
#
# A substituted value is inserted verbatim, so a token containing `:` or `#`
# must be quoted in this file, e.g. token: "${ALCHEMY_KEY_A}".

server:
  port: 8545
  host: "127.0.0.1"
  auth:
    methods: ["path", "bearer"]
    keys:
      - { token: "${KISEKI_KEY_MAIN}", label: main }
      - { token: "${KISEKI_KEY_INDEXER}", label: indexer }

defaults:
  costs:
    "eth_call": 1
    "eth_getLogs": 2
    "trace_*": 5
    "debug_*": 5
    "replay_*": 10
  timeouts:
    default_seconds: 30
    heavy_seconds: 120
    heavy_methods: ["trace_*", "debug_*", "replay_*"]
  blocked_methods: ["eth_sendTransaction"]

chains:
  ethereum:
    upstreams:
      - name: alchemy-ethereum           # instance = provider + chain
        provider: alchemy                # identity used for bucket sharing (§5.4)
        package: alchemy                 # adapter package; "generic" = fallback
        url_template: "https://eth-mainnet.g.alchemy.com/v2/{apikey}"
        apikeys:
          - { token: "${ALCHEMY_KEY_A}", label: a,
              buckets: [{ capacity: 330, refill_per_second: 330 }] }
          - { token: "${ALCHEMY_KEY_B}", label: b,
              buckets: [{ capacity: 330, refill_per_second: 330 }] }
        methods: ["eth_*", "trace_*", "debug_*", "replay_*"]
        archive: true
        costs: { "eth_call": 2, "trace_block": 5 }   # override over the CU table
        counts_batch_as_one_request: false

      # ── Ankr, split in two — this is not a style choice ──────────────────
      # Ankr serves its Advanced API (`ankr_*`) ONLY on the multichain endpoint,
      # and that endpoint rejects every node method (`eth_blockNumber` → -32601).
      # The per-chain endpoint is the mirror image: `ankr_*` → -32601. One
      # instance has one `url_template`, so one instance cannot serve both.
      # Verified live; see plan/notes-m0.md §1.
      - name: ankr-ethereum-aapi
        # ⚠️ `provider` is the bucket-sharing identity (§5.4) and the two Ankr
        # halves must NOT share it: they are metered in different units (API
        # credits vs RPS). Sharing one identity with two different bucket specs
        # would silently rebuild the bucket and discard spent credits.
        # Same provider string on another chain DOES share the AAPI credit pool.
        provider: ankr-aapi
        package: ankr                   # supplies kiseki_* translations + 700 credits
        url_template: "https://rpc.ankr.com/multichain/{apikey}"
        apikeys:
          # ⚠️ Advanced API = 700 credits PER REQUEST. A bucket sized for RPS is
          # drained ~47× faster than by eth_call, so size these in credits: the
          # numbers below allow ~1.7 AAPI calls/second sustained.
          - token: "${ANKR_KEY}"
            label: main
            buckets:
              - { capacity: 1200, refill_per_second: 1200 }  # credits (≈1.7 AAPI/s)
        # `ankr_*` also exposes the raw Advanced API methods directly (decision F3).
        # Coverage of `kiseki_*` is DERIVED from the package translation table —
        # never list kiseki_* here.
        methods: ["ankr_*"]
        archive: false

      - name: ankr-ethereum-node
        provider: ankr-node             # own identity: RPS/RPM metering
        package: generic                # plain JSON-RPC, nothing Ankr-specific
        url_template: "https://rpc.ankr.com/eth/{apikey}"
        apikeys:
          - token: "${ANKR_KEY}"
            label: main
            buckets:
              - { capacity: 15,  refill_per_second: 15 }    # RPS
              - { capacity: 600, refill_per_second: 10 }    # RPM
        methods: ["eth_*"]
        archive: false

  base:
    upstreams:
      - name: alchemy-base
        provider: alchemy
        package: alchemy
        url_template: "https://base-mainnet.g.alchemy.com/v2/{apikey}"
        apikeys:
          # Same token as ethereum → the SAME bucket, automatically (§5.4).
          - { token: "${ALCHEMY_KEY_A}", label: a,
              buckets: [{ capacity: 330, refill_per_second: 330 }] }
        methods: ["eth_*", "debug_*"]
        archive: true

limits:
  max_total_attempts: 0        # 0 = unlimited (default); >0 = safety valve

metrics:
  enabled: true
